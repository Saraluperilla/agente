<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Responsive — Cachorro / Adolescente / Adulto</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #262626;
      color: #ffffff;
    }

    section {
      padding: 40px 20px;
      text-align: center;
    }

    .titulo h1 {
      font-size: 2rem;
      margin: 0;
      color:aqua;
    }

     .titulo h2 {
      font-size: 2rem;
      margin: 0;
    }

     .titulo h3 {
      font-size: 2rem;
      margin: 0;
    }

    .imagen img {
      max-width: 100%;
      width: 400px;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
    }

    .descripcion p {
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <section class="titulo">
    <h1 id="titulo">Cachorro</h1>
  </section>

  <section class="imagen">
    <img id="imagen" src="https://placedog.net/500/300?id=10" alt="Cachorro">
  </section>

  <section class="descripcion">
    <p id="descripcion">
      Los perritosssss</p>
  </section>

</body>
<script>

const titulo = document.getElementById("titulo");
const imagen = document.getElementById("imagen");
const descripcion = document.getElementById("descripcion");

function resize () {
  if (window.innerWidth >= 1024) {
    titulo.textContent = "Mariposa";
    imagen.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTM33kCbD7d7Qf5LmpTE3vxxTmSEYOLF3pNkQk9rWp0CA&s=10";
    imagen.alt = "Mariposa";
    descripcion.textContent = "El perro adulto ya alcanzó su desarrollo completo. Su energía se estabiliza y requiere una rutina de ejercicio y alimentación acorde a su tamaño y raza.";
  }
  else if (window.innerWidth >= 768)
  {
    titulo.textContent = "Crisalida";
    imagen.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4GSu-qDL4F-_dTpKh8NIN9TOkZalYE36YVs0o0JDWBsAY_SdMQ8Zz1Q_f&s=10";
    imagen.alt = "Crisalida";
    descripcion.textContent = "El perro adolescente atraviesa una etapa de cambios físicos y de comportamiento. Es el momento clave para reforzar el entrenamiento y establecer buenos hábitos.";
  }
  else {
    titulo.textContent = "Oruga";
    imagen.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_uxVrtJ1igw8R0EesS05e_yXKhpcxrXslO259vFyrqA&s=10";
    imagen.alt = "Oruga de mariposa";
    descripcion.textContent = "Los cachorros son perros en su primera etapa de vida, llenos de energía y curiosidad. Necesitan cuidados especiales, vacunas y mucha socialización temprana.";
  }
}

window.addEventListener ("resize", resize);

resize ();

</script>
</html>
