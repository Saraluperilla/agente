<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing page</title>
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <main class="landing">

    <!-- Section 1: title -->
    <header class="section section--title">
      <h1>Main title</h1>
      <p class="subtitle">Short subtitle or tagline</p>
    </header>

    <!-- Section 2: image -->
    <section class="section section--image">
      <img src="https://placehold.co/1200x600" alt="Describe here what the image shows">
    </section>

    <!-- Section 3: text -->
    <section class="section section--text">
      <h2>Section heading</h2>
      <p>
        Replace this text with the content of your landing page. Keep the
        paragraph short and focused on one idea so it is easy to read.
      </p>
    </section>

  </main>
</body>
</html>
