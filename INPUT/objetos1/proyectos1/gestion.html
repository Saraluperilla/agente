<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de animales</title>
  <!-- Mismos estilos base que index.html -->
  <link rel="stylesheet" href="styles.css">
</head>
<!-- Clase "gestion" en el body: la usa styles.css para poner sidebar +
     contenido en fila, en vez del layout en columna que usa index.html -->
<body class="gestion">

  <!-- Lo único visible al cargar la página. login.js valida lo que se
       escribe aquí con validarCredenciales() de credenciales.js, y solo
       si es correcto muestra el sidebar y el <main> (que arrancan hidden) -->
  <div id="login" class="login">
    <div class="login-caja">
      <h1>Iniciar sesión</h1>
      <form id="form-login" class="form-crear">
        <label for="login-usuario">Usuario</label>
        <input type="text" id="login-usuario" name="usuario" autocomplete="username" required>

        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>

        <p id="login-error" class="login-error" hidden>Usuario o contraseña incorrectos</p>

        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <aside class="sidebar" hidden>
    <h2 class="sidebar-titulo">Gestión</h2>
    <nav class="sidebar-nav">
      <!-- data-seccion apunta al id de la sección que gestion.js muestra
           al hacer click en cada botón (ver mostrarSeccion() en gestion.js) -->
      <button class="sidebar-item activo" data-seccion="mostrar-todos">Mostrar todos</button>
      <button class="sidebar-item" data-seccion="crear">Crear</button>
      <button class="sidebar-item" data-seccion="consultar">Consultar</button>
      <button class="sidebar-item" data-seccion="actualizar">Actualizar</button>
      <button class="sidebar-item" data-seccion="eliminar">Eliminar</button>
    </nav>
    <!-- Sin data-seccion: no es una sección del CRUD, recarga la página
         para volver al login (ver gestion.js) -->
    <button id="btn-cerrar-sesion" class="sidebar-item sidebar-salir">Cerrar sesión</button>
  </aside>

  <main class="contenido" hidden>

    <!-- Se ve por defecto (coincide con el botón "activo" de arriba) -->
    <section id="seccion-mostrar-todos" class="seccion">
      <h1>Todos los animales</h1>
      <!-- gestion.js la llena con una fila por cada animal de "animales" -->
      <table id="tabla-animales">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Hábitat</th>
            <th>Alimentación</th>
            <th>Peso (kg)</th>
            <th>Peligroso</th>
          </tr>
        </thead>
        <tbody id="tabla-animales-body"></tbody>
      </table>
    </section>

    <section id="seccion-crear" class="seccion" hidden>
      <h1>Crear animal</h1>
      <!-- Un campo por propiedad del objeto animal (ver data.js). gestion.js
           lee estos valores en el submit y arma el objeto con agregarAnimal() -->
      <form id="form-crear" class="form-crear">
        <label for="crear-nombre">Nombre</label>
        <input type="text" id="crear-nombre" name="nombre" required>

        <label for="crear-imagen">Imagen (URL)</label>
        <input type="url" id="crear-imagen" name="imagen" required>

        <label for="crear-posicionImagen">Posición de la imagen (opcional)</label>
        <input type="text" id="crear-posicionImagen" name="posicionImagen" placeholder="ej: center 10%">

        <label for="crear-descripcion">Descripción</label>
        <textarea id="crear-descripcion" name="descripcion" rows="3" required></textarea>

        <label for="crear-habitat">Hábitat</label>
        <input type="text" id="crear-habitat" name="habitat" required>

        <label for="crear-alimentacion">Alimentación</label>
        <input type="text" id="crear-alimentacion" name="alimentacion" required>

        <label for="crear-pesoKg">Peso (kg)</label>
        <input type="number" id="crear-pesoKg" name="pesoKg" min="0" step="any" required>

        <label for="crear-habilidades">Habilidades (separadas por coma)</label>
        <input type="text" id="crear-habilidades" name="habilidades" placeholder="ej: Nadar, Cazar, Trepar" required>

        <label class="form-checkbox">
          <input type="checkbox" id="crear-peligroso" name="peligroso">
          Peligroso
        </label>

        <button type="submit">Agregar animal</button>
      </form>
    </section>

    <section id="seccion-consultar" class="seccion" hidden>
      <h1>Consultar animal</h1>
      <!-- Los <select class="select-animal"> los llena gestion.js con una
           opción "id - nombre" por animal (ver renderizarSelectores()) -->
      <div class="form-crear">
        <label for="consultar-id">Animal</label>
        <select id="consultar-id" class="select-animal"></select>
      </div>
      <!-- Ficha con todas las propiedades del animal elegido -->
      <article id="ficha-animal" class="ficha" hidden></article>
    </section>

    <section id="seccion-actualizar" class="seccion" hidden>
      <h1>Actualizar animal</h1>
      <div class="form-crear">
        <label for="actualizar-id">Animal</label>
        <select id="actualizar-id" class="select-animal"></select>
      </div>
      <!-- Mismos campos (y mismos "name") que form-crear, así gestion.js
           usa la misma función leerAnimalDelFormulario() para ambos. Se
           muestra solo cuando hay un animal elegido arriba -->
      <form id="form-actualizar" class="form-crear" hidden>
        <label for="actualizar-nombre">Nombre</label>
        <input type="text" id="actualizar-nombre" name="nombre" required>

        <label for="actualizar-imagen">Imagen (URL)</label>
        <input type="url" id="actualizar-imagen" name="imagen" required>

        <label for="actualizar-posicionImagen">Posición de la imagen (opcional)</label>
        <input type="text" id="actualizar-posicionImagen" name="posicionImagen" placeholder="ej: center 10%">

        <label for="actualizar-descripcion">Descripción</label>
        <textarea id="actualizar-descripcion" name="descripcion" rows="3" required></textarea>

        <label for="actualizar-habitat">Hábitat</label>
        <input type="text" id="actualizar-habitat" name="habitat" required>

        <label for="actualizar-alimentacion">Alimentación</label>
        <input type="text" id="actualizar-alimentacion" name="alimentacion" required>

        <label for="actualizar-pesoKg">Peso (kg)</label>
        <input type="number" id="actualizar-pesoKg" name="pesoKg" min="0" step="any" required>

        <label for="actualizar-habilidades">Habilidades (separadas por coma)</label>
        <input type="text" id="actualizar-habilidades" name="habilidades" required>

        <label class="form-checkbox">
          <input type="checkbox" id="actualizar-peligroso" name="peligroso">
          Peligroso
        </label>

        <button type="submit">Guardar cambios</button>
      </form>
    </section>

    <section id="seccion-eliminar" class="seccion" hidden>
      <h1>Eliminar animal</h1>
      <div class="form-crear">
        <label for="eliminar-id">Animal</label>
        <select id="eliminar-id" class="select-animal"></select>

        <!-- Confirmación dentro de la página (en vez de confirm()): solo
             aparece cuando hay un animal elegido -->
        <div id="eliminar-confirmacion" hidden>
          <p id="eliminar-mensaje"></p>
          <div class="form-botones">
            <button type="button" id="btn-eliminar">Sí, eliminar</button>
            <button type="button" id="btn-cancelar-eliminar">Cancelar</button>
          </div>
        </div>
      </div>
    </section>

  </main>

</body>
<!-- Orden importante: login.js usa validarCredenciales() (credenciales.js)
     y gestion.js usa leerAnimales() (data.js) e iniciarLogin() (login.js) -->
<script src="data.js"></script>
<script src="credenciales.js"></script>
<script src="login.js"></script>
<script src="gestion.js"></script>
</html>
