<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi cuenta</title>
<link rel="stylesheet" href="css/cliente.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<!-- Layout de 2 columnas: a la izquierda registro/login, a la derecha
     la sidebar fija con los datos del perfil -->
<div id="layout-cuenta">
<section id="panel-cuenta">
<h2>Mi cuenta</h2>
<p id="estado-sesion">No has iniciado sesión.</p>
<form id="form-registro">
<h3>Registrarme</h3>
<label for="registro-nombre">Nombre</label>
<input id="registro-nombre" type="text" required />
<label for="registro-correo">Correo</label>
<input id="registro-correo" type="email" required />
<label for="registro-password">Contraseña</label>
<input id="registro-password" type="password" minlength="6" required />
<button type="submit">Crear cuenta</button>
</form>
<form id="form-login">
<h3>Iniciar sesión</h3>
<label for="login-correo">Correo</label>
<input id="login-correo" type="email" required />
<label for="login-password">Contraseña</label>
<input id="login-password" type="password" required />
<button type="submit">Iniciar sesión</button>
</form>
</section>

<!-- Tarjeta de bienvenida: reemplaza a los formularios cuando hay sesión -->
<section id="panel-bienvenida" hidden>
<p class="insignia">✔ Sesión iniciada</p>
<h2 id="saludo">Cargando…</h2>
<p id="datos-usuario"></p>
</section>

<!-- Sidebar estática: siempre visible. Sin sesión, el <fieldset> está
     disabled y bloquea TODOS los campos de una vez; al iniciar sesión,
     JS le quita el disabled y llena los datos. -->
<aside id="sidebar-perfil" aria-labelledby="titulo-perfil">
<h3 id="titulo-perfil">Mis datos</h3>
<p id="aviso-perfil">🔒 Inicia sesión para ver y editar tus datos.</p>
<form id="form-editar">
<fieldset id="campos-perfil" disabled>
<label for="editar-nombre">Nombre</label>
<input id="editar-nombre" type="text" required />
<label for="editar-telefono">Teléfono</label>
<input id="editar-telefono" type="tel" />
<label for="editar-direccion">Dirección</label>
<input id="editar-direccion" type="text" />
<label for="editar-correo">Correo</label>
<input id="editar-correo" type="email" readonly />
<label for="editar-rol">Rol</label>
<input id="editar-rol" type="text" readonly />
<button type="submit">Guardar cambios</button>
</fieldset>
<p id="mensaje-editar" aria-live="polite"></p>
</form>
<button id="btn-logout" type="button" hidden>Cerrar sesión</button>
</aside>
</div>
<script src="js/supabaseClient.js"></script>
<script src="js/cliente.js"></script>
</body>
</html>
