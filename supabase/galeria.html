<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda — galería</title>
  <link rel="stylesheet" href="css/galeria.css">
</head>
<body>

  <!-- Header fijo: logo, buscador y carrito. Se queda arriba al hacer scroll. -->
  <header class="topbar">
    <a class="logo" href="#inicio">✦ Tienda</a>

    <label class="search">
      <span class="visually-hidden">Buscar productos</span>
      <input id="search-input" type="search" placeholder="Buscar productos..." autocomplete="off">
    </label>

    <button id="btn-open-cart" class="cart-button" type="button" aria-label="Abrir carrito">
      <span aria-hidden="true">🛒</span>
      <span class="cart-label">Carrito</span>
      <!-- El número lo pone galeria.js; se oculta si el carrito está vacío -->
      <span id="cart-count" class="cart-count" hidden>0</span>
    </button>
  </header>

  <main id="inicio">
    <section class="hero">
      <p class="pill">Nuevo · Temporada 2026</p>
      <h1>Encuentra lo que te gusta</h1>
      <p>Desliza cada fila para ver más, o toca un producto para ver el detalle.</p>
    </section>

    <!-- Chips de categorías: los crea galeria.js a partir de los datos.
         Cada uno es un link a la fila de esa categoría (#shelf-...). -->
    <nav id="category-chips" class="chips" aria-label="Categorías"></nav>

    <!-- Aquí galeria.js pinta una "fila" (shelf) por categoría -->
    <div id="shelves" class="shelves"></div>

    <p id="empty-search" class="empty" hidden></p>
  </main>

  <!-- DETALLE: <dialog> es un modal nativo del navegador: showModal() lo
       abre encima de todo, Esc lo cierra solo y el foco queda atrapado
       adentro (no hay que programarlo). El contenido lo llena galeria.js. -->
  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title"></dialog>

  <!-- CARRITO: panel lateral. Mismo truco que el aside de cliente.html:
       siempre existe, pero corrido fuera de la pantalla hasta tener .is-open -->
  <div id="cart-backdrop" class="backdrop" hidden></div>
  <aside id="cart-drawer" class="drawer" aria-labelledby="cart-title" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="cart-title">Tu carrito</h2>
      <button id="btn-close-cart" class="icon-button" type="button" aria-label="Cerrar carrito">✕</button>
    </div>

    <ul id="cart-list" class="cart-list"></ul>

    <div id="cart-summary" class="cart-summary">
      <p class="summary-row"><span>Subtotal</span><span id="cart-subtotal">$0</span></p>
      <p class="summary-row savings" id="cart-savings-row"><span>Ahorras</span><span id="cart-savings">$0</span></p>
      <p class="summary-row total"><span>Total</span><span id="cart-total">$0</span></p>
      <button id="btn-checkout" class="primary" type="button">Ir a pagar</button>
    </div>
  </aside>

  <!-- Aviso flotante ("Agregado al carrito") -->
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Sin Supabase por ahora: los productos vienen de un array en galeria.js -->
  <script src="js/galeria.js"></script>
</body>
</html>
